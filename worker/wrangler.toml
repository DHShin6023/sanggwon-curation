name = "sanggwon-proxy"
main = "src/index.js"
compatibility_date = "2026-08-01"

# 일 한도 카운터용 KV(개정 (나)6). 배포 전에 아래 명령으로 만들고 출력된
# id를 채운다:
#
#   npx wrangler kv namespace create RATE
#
# id를 채우지 않으면 wrangler deploy가 실패한다 — 이게 의도한 동작이다.
# 바인딩 없이 배포되면 AI 두 엔드포인트가 항상 {text:null}/{code:null}로
# 떨어지고(등급·근거는 정상), 왜 AI 해설이 안 나오는지 알기 어려워진다.
[[kv_namespaces]]
binding = "RATE"
id = "여기에-wrangler-kv-namespace-create-RATE-출력-id를-넣는다"

# 모델 id(개정 (다)). 코드의 기본값은 2024년 프리뷰 모델이라 살아 있다고
# 가정하지 않는다. 배포 시 OpenRouter에서 **현행 무료 모델**을 확인해
# 아래 주석을 풀고 지정할 것. 자세한 건 README 참고.
#
# [vars]
# MODEL = "확인한/현행-무료-모델:free"

# ⚠️ KAKAO_REST_KEY / OPENROUTER_KEY는 절대 이 파일에 쓰지 않는다.
#    `npx wrangler secret put <이름>` 만 사용한다.
