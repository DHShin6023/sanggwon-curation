<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상권 큐레이션</title>
<link rel="stylesheet" href="css/style.css">

<!-- 홈화면 추가 / PWA. 경로는 전부 **상대경로**여야 한다 — 사이트가
     도메인 루트가 아니라 /sanggwon-curation/ 하위에 붙어 있어서
     "/icons/..."로 쓰면 404가 난다(html-contract 테스트가 이걸 막는다).
     아이콘 원본은 코드다: scripts/make_icons.py 를 고치고 다시 돌리면 된다. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="theme-color" content="#0c1425">
<!-- iOS는 manifest의 name을 홈화면 이름으로 쓰지 않는다 — 이 태그를 봐야 한다.
     없으면 <title>이 쓰이는데 길면 잘린다. -->
<meta name="apple-mobile-web-app-title" content="상권 큐레이션">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<main>
  <header>
    <div class="header-row">
      <h1>상권 큐레이션</h1>
      <!-- 결과를 본 뒤 다른 물건지·업종을 바로 넣을 수 있게. 페이지를 새로
           고치지 않고 화면만 비운다 — 새로고침하면 meta.json과 데이터
           파일을 전부 다시 받아 느리다. -->
      <button type="button" id="reset" class="reset">↻ 새로 입력</button>
    </div>
    <p class="tagline">이 서비스는 결정해주지 않습니다. 현장에 나가기 전에 후보를 걸러줍니다.</p>
    <!-- I4(최종 리뷰): 화면 어디에도 "서울만 된다"는 말이 없어서, 경기 주소를
         넣으면 「범위 밖입니다」만 뜨고 사용자는 자기 주소가 특별히 안 되는
         줄로 읽는다. 서비스 범위는 첫 화면에서 밝힌다. -->
    <p class="scope-notice">현재 <strong>서울</strong>만 분석합니다. 서울 외 주소는 결과가 나오지 않습니다.</p>
    <p id="provisional-notice" class="provisional-notice" hidden></p>
  </header>

  <form id="query">
    <label>물건지 주소
      <input id="address" name="address" required placeholder="예) 서울 마포구 양화로 45">
    </label>
    <label>오픈하려는 업종
      <input name="industry" required list="industry-options"
             placeholder="예) 한식, 커피, 치킨, 세탁소 (목록에서 선택 가능)">
      <datalist id="industry-options"></datalist>
    </label>
    <label>층수
      <select name="floor" required>
        <option value="B1">지하</option>
        <option value="F1" selected>1층</option>
        <option value="F2">2층</option>
        <option value="F3P">3층 이상</option>
        <option value="DETACHED">단독건물</option>
      </select>
    </label>
    <button type="submit">분석하기</button>
  </form>

  <!-- F9: aria-live로 결과 갱신을 스크린리더에 알리고, tabindex="-1"로
       제출 후 포커스를 여기로 옮길 수 있게 한다(main.js). -->
  <section id="result" hidden aria-live="polite" tabindex="-1"></section>

  <footer>
    <p id="data-period"></p>
    <p class="disclaimer">
      이 분석은 공개 데이터 기반의 사전 스크리닝입니다.
      임대 조건, 자리의 가시성, 건물 상태 등은 반드시 현장에서 직접 확인하십시오.
    </p>
    <p id="sources" class="sources"></p>
  </footer>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
