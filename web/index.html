<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상권 큐레이션</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <header>
    <h1>상권 큐레이션</h1>
    <p class="tagline">이 서비스는 결정해주지 않습니다. 현장에 나가기 전에 후보를 걸러줍니다.</p>
    <!-- I4(최종 리뷰): 화면 어디에도 "서울만 된다"는 말이 없어서, 경기 주소를
         넣으면 「범위 밖입니다」만 뜨고 사용자는 자기 주소가 특별히 안 되는
         줄로 읽는다. 서비스 범위는 첫 화면에서 밝힌다. -->
    <p class="scope-notice">현재 <strong>서울</strong>만 분석합니다. 서울 외 주소는 결과가 나오지 않습니다.</p>
    <p id="provisional-notice" class="provisional-notice" hidden></p>
  </header>

  <form id="query">
    <label>물건지 주소
      <input name="address" required placeholder="예) 서울 마포구 양화로 45">
    </label>
    <label>오픈하려는 업종
      <input name="industry" required list="industry-options"
             placeholder="예) 한식, 커피, 치킨, 세탁소 (목록에서 선택 가능)">
      <datalist id="industry-options"></datalist>
    </label>
    <label>층수
      <select name="floor" required>
        <option value="B1">지하</option>
        <option value="F1" selected>1층</option>
        <option value="F2">2층</option>
        <option value="F3P">3층 이상</option>
        <option value="DETACHED">단독건물</option>
      </select>
    </label>
    <button type="submit">분석하기</button>
  </form>

  <!-- F9: aria-live로 결과 갱신을 스크린리더에 알리고, tabindex="-1"로
       제출 후 포커스를 여기로 옮길 수 있게 한다(main.js). -->
  <section id="result" hidden aria-live="polite" tabindex="-1"></section>

  <footer>
    <p id="data-period"></p>
    <p class="disclaimer">
      이 분석은 공개 데이터 기반의 사전 스크리닝입니다.
      임대 조건, 자리의 가시성, 건물 상태 등은 반드시 현장에서 직접 확인하십시오.
    </p>
    <p id="sources" class="sources"></p>
  </footer>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
