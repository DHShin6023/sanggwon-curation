name: quarterly-etl

on:
  schedule:
    - cron: "0 18 5 2,5,8,11 *"   # 분기 갱신 직후(KST 새벽 3시)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # 아래 「Pages 재배포」에서 pages.yml을 직접 호출한다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 경계 폴리곤 생성에 geopandas가 필요하다. requirements.txt만 깔면
      # etl.build가 boundary import에서 그대로 죽는다.
      - run: pip install -r etl/requirements-geo.txt

      - name: 수집 + 빌드
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python -m etl.build

      - run: python -m pytest etl/tests/ -v

      - name: 데이터 신선도 검사
        run: |
          python3 - <<'PY'
          import json, sys
          from datetime import date
          meta = json.load(open("web/data/meta.json", encoding="utf-8"))
          period = str(meta["period"])
          today = date.today()
          now = today.year * 4 + (today.month - 1) // 3
          got = int(period[:4]) * 4 + int(period[4]) - 1
          gap = now - got
          print(f"데이터 기준: {meta['period_label']} (오늘로부터 {gap}분기 전)")
          # 서울 게시가 늦어도 2분기 안에는 올라온다. 3분기를 넘겼다면 수집이
          # 조용히 옛 분기에 머물러 있다는 뜻 — 화면은 멀쩡해 보이므로 여기서
          # 터뜨리지 않으면 1년째 묵은 데이터를 서비스하게 된다.
          if gap > 3:
              print(f"::error::데이터가 {gap}분기 묵었다 — 수집 경로 점검 필요")
              sys.exit(1)
          PY

      # ⚠️ 2026-08-09 (최종 리뷰 I5): 예전 이름은 「잠정 도메인 자산이면 배포
      # 차단」이었고 provisional일 때 exit 1 했다. 두 가지가 틀렸다.
      #
      #  1. **차단하는 대상이 배포가 아니다.** 이 저장소에 배포 워크플로는 없고
      #     Pages는 커밋된 내용을 그대로 서비스한다. 실제로 막히던 건 바로 아래
      #     「변경분 커밋」이다 — 즉 분기 갱신이 조용히 멈추고, 화면의 기준 분기
      #     라벨은 멀쩡해 보이는 채로 묵은 데이터를 계속 서비스하게 된다.
      #  2. **지금 무조건 발동한다.** 도메인 자산 4종이 전부 provisional: true인
      #     채로 런칭하기로 했고(Task 13 폐기, 검증은 실사용으로), 이 상태는
      #     당분간 유지된다. 화면 배너가 그 사실을 직접 밝히므로 숨기는 것도 아니다.
      #
      # 그래서 갱신을 막지 않고 경고만 남긴다. 이 게이트가 원래 잡으려던 것
      # (계수가 전부 1.0인 자리표시자 상태로 나가는 것)은 web/tests/
      # alternatives.test.js가 훨씬 정확하게 잡고 있다.
      - name: 도메인 자산 잠정 여부 확인(경고만)
        run: |
          python3 - <<'PY'
          import json
          meta = json.load(open("web/data/meta.json", encoding="utf-8"))
          if meta.get("provisional"):
              print("::warning::도메인 자산이 아직 잠정값(provisional: true)이다 — "
                    "화면 배너로 고지 중이며, 실사용 데이터가 쌓이면 해제 판단할 것")
          PY

      - name: 변경분 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): 분기 갱신"
            git pull --rebase --autostash
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ⚠️ 2026-11-06: GITHUB_TOKEN으로 한 push는 다른 워크플로의 push 트리거를
      # 깨우지 않는다(GitHub의 무한루프 방지 규칙). 그래서 위 커밋만으로는
      # pages.yml이 돌지 않고 GitHub Pages가 옛 데이터에 머문다 — Vercel은
      # 자체 Git 연동이라 갱신되므로 두 주소가 조용히 어긋난다.
      # workflow_dispatch는 이 규칙의 예외라 직접 호출한다.
      - name: Pages 재배포
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
