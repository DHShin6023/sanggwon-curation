name: pages

# web/ 폴더만 GitHub Pages로 배포한다.
#
# 왜 이 워크플로가 필요한가: GitHub Pages는 저장소 **루트** 아니면 **/docs**
# 둘 중에서만 사이트를 서비스한다. 그런데 이 프로젝트의 웹 루트는 web/ 이고,
# 저장소에는 파이썬 ETL(etl/), 원본 데이터(data/), 설계 문서(docs/)가 함께
# 있다. 그것들을 그대로 공개하지 않으려면 web/ 만 골라 올려야 한다.
#
# gh-pages 브랜치를 따로 두지 않고 공식 Pages 아티팩트 방식을 쓴다 — 브랜치가
# 하나 늘면 "소스는 main인데 배포는 gh-pages"라는 상태가 생기고, 그 둘이
# 어긋났을 때 알아채기 어렵다.
#
# ⚠️ 저장소 설정에서 **Settings → Pages → Source를 "GitHub Actions"로**
#    한 번 바꿔줘야 한다. "Deploy from a branch"로 두면 이 워크플로는 성공했다고
#    나오면서 사이트는 안 바뀐다 — 조용히 어긋나는 상태라 꼭 확인할 것.

on:
  push:
    branches: [main]
  # quarterly-etl이 web/data/ 를 커밋해도 위 push 트리거는 깨어나지 않는다
  # (GITHUB_TOKEN push는 워크플로를 트리거하지 않음). 그래서 quarterly-etl이
  # 커밋 후 이 워크플로를 workflow_dispatch로 직접 호출한다.
  workflow_dispatch:

# 배포는 한 번에 하나만. 연달아 밀면 나중 것이 먼저 끝나 옛 버전이 남을 수 있다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 배포 전에 테스트를 돌린다. 이 저장소의 공식 실행 명령은 파일별 반복이다 —
      # `node --test web/tests/` 디렉터리형은 Node 26에서 ERR_MODULE_NOT_FOUND로
      # 깨진다(README 참고).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 웹 테스트
        run: |
          fail=0
          for f in web/tests/*.test.js; do
            node --test "$f" || fail=1
          done
          exit $fail

      # 올라가면 안 되는 게 web/ 안에 있는지 확인한다. web/ 는 통째로 공개되므로
      # 여기 실수로 들어온 키·원본은 그대로 인터넷에 나간다.
      - name: 공개 디렉터리 점검
        run: |
          python3 - <<'PY'
          import pathlib, sys
          web = pathlib.Path("web")
          bad = [str(p) for p in web.rglob("*")
                 if p.is_file() and (p.name.startswith(".env") or p.suffix in {".parquet", ".shp", ".dbf"})]
          if bad:
              print("::error::web/ 에 공개되면 안 되는 파일이 있다: " + ", ".join(bad))
              sys.exit(1)
          print(f"web/ 파일 {sum(1 for p in web.rglob('*') if p.is_file())}개 — 문제 없음")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web          # 저장소 루트가 아니라 web/ 만 올린다
      - id: deployment
        uses: actions/deploy-pages@v4
